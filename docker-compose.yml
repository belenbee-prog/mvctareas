services:
  php:
    build:
      dockerfile: Dockerfile
      context: .
    restart: unless-stopped
    stdin_open: true
    ports:
      - "8010:8000"
    volumes:
      - .:/var/www/html:delegated
    networks:
      - s_aev1_network

  mariadb:
    image: mariadb
    ports:
      - "3310:3306"
    restart: unless-stopped
    environment:
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: DwEs.26
    volumes:
      - db_s_aev1:/var/lib/mysql
    networks:
      - s_aev1_network

volumes:
  db_s_aev1:

networks:
  s_aev1_network:
