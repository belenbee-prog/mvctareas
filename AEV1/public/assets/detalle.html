<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle de la tarea | AEV1</title>
  <link rel="stylesheet" href="/assets/css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <div class="contenedor barra">
      <a class="marca" href="/">AEV1 <span>· Tareas</span></a>
      <nav aria-label="Navegación principal">
        <a href="/">Inicio</a>
        <a href="/tareas">Tareas</a>
        <a href="/crear">Crear tarea</a>
      </nav>
    </div>
  </header>
  <main class="contenedor contenido">
    <p class="etiqueta">Detalle de la tarea</p>
    <h1><?= htmlspecialchars($task['title']) ?></h1>

    <section class="tarjeta ficha" style="border-inline-start-color: <?= htmlspecialchars((string) ($task['color'] ?? ''), ENT_QUOTES, 'UTF-8') ?>">
      <dl class="datos">
        <div class="dato-ancho">
          <dt>Descripción</dt>
          <dd class="descripcion"><?= htmlspecialchars($task['description']) ?></dd>
        </div>
        <div>
          <dt>Fecha de creación</dt>
          <dd><?= htmlspecialchars($task['created_at']) ?></dd>
        </div>
        <div>
          <dt>Fecha de vencimiento</dt>
          <dd><?= htmlspecialchars($task['due_date']) ?></dd>
        </div>
        <div>
          <dt>ID</dt>
          <dd><?= htmlspecialchars((string) $task['id']) ?></dd>
        </div>
        <div>
          <dt>Slug</dt>
          <dd><?= htmlspecialchars((string) ($task['slug'] ?? '')) ?></dd>
        </div>
      </dl>
      <div class="acciones">
        <a class="boton boton-secundario" href="/tareas">Volver al listado</a>
        <a class="boton boton-peligro" href="/deleteTask/<?= htmlspecialchars((string) $task['id'], ENT_QUOTES, 'UTF-8') ?>">Eliminar tarea</a>
      </div>
    </section>
  </main>
</body>
</html>
